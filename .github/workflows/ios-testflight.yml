name: iOS TestFlight

# Builds Sentinel.ipa from the ios-port branch and uploads it to TestFlight on tag push.
# Runs on macOS so Xcode + xcodebuild + xcrun altool are available.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_API_KEY_ID         App Store Connect API key ID (e.g. "ABC123XYZ")
#   APP_STORE_CONNECT_API_ISSUER_ID      Your team's issuer UUID
#   APP_STORE_CONNECT_API_KEY_P8         The .p8 private key file (paste the whole text)
#   IOS_DEVELOPER_TEAM_ID                Your 10-char Apple Developer team ID
#
# Trigger: push a tag like `ios-v2.0.1` and the workflow uploads to TestFlight.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-14         # ships Xcode 15.x + iOS 17 SDK
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Sentinel.xcodeproj
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift Packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Sentinel.xcodeproj -scheme Sentinel

      - name: Build & archive
        working-directory: ios
        run: |
          xcodebuild \
            -project Sentinel.xcodeproj \
            -scheme Sentinel \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Sentinel.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPER_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            clean archive

      - name: Export .ipa
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>destination</key><string>export</string>
              <key>signingStyle</key><string>automatic</string>
              <key>teamID</key><string>${{ secrets.IOS_DEVELOPER_TEAM_ID }}</string>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/Sentinel.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        working-directory: ios
        env:
          API_KEY_ID:  ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8:  ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ipa/Sentinel.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"
