# XcodeGen project spec. Generates Sentinel.xcodeproj from this YAML — no binary project file
# is checked in. Run `xcodegen generate` (after `brew install xcodegen`) on the Mac.

name: Sentinel
options:
  bundleIdPrefix: org.artyllm
  # Min iOS bumped to 16.2 so we can use the ActivityContent API without availability wrappers.
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: en
  # Bundle supports English (Base) + Portuguese. iOS will pick automatically based on user locale.
  knownRegions: [en, pt, Base]
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    TARGETED_DEVICE_FAMILY: "1,2"    # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

packages:
  HaishinKit:
    # RTMP / RTSP / SRT publisher built on AVFoundation. Provides RTMPStream / SRTStream /
    # RTSPStream that take an AVCaptureSession feed and a server URL.
    url: https://github.com/shogo4405/HaishinKit.swift
    from: "1.9.6"
  ZIPFoundation:
    # Read ATAK / TAK Server data-package .zip files. Pure Swift, no Foundation Archive coupling.
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  Sentinel:
    type: application
    platform: iOS
    sources:
      - path: Sentinel
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: Shared          # WatchPayload — shared with the watchOS target
    resources:
      - path: Sentinel/Resources/Assets.xcassets
        optional: true
      - path: Sentinel/Resources/en.lproj
        optional: true
      - path: Sentinel/Resources/pt.lproj
        optional: true
      - path: Sentinel/Resources/PrivacyInfo.xcprivacy
        optional: true
    info:
      path: Sentinel/Info.plist
      properties:
        CFBundleDisplayName: SENTINEL
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio              # keeps encoder running with screen off
          - bluetooth-central  # GoPro BLE link survives backgrounding
        NSCameraUsageDescription:        Stream the camera to a remote server.
        NSMicrophoneUsageDescription:    Capture audio alongside the camera stream.
        NSLocationWhenInUseUsageDescription:
          Tag the video with timestamp + GPS and report position to the TAK server.
        NSBluetoothAlwaysUsageDescription:
          Pair with a GoPro camera over Bluetooth Low Energy.
        NSLocalNetworkUsageDescription:
          Push streams to a local MediaMTX or TAK Server on your network.
        NSBonjourServices: ["_rtsp._tcp", "_rtmp._tcp", "_srt._udp"]
        # Live Activity (Dynamic Island + lock-screen widget).
        NSSupportsLiveActivities: true
        # Open .zip data packages from Files / AirDrop / share sheet straight into SENTINEL.
        CFBundleDocumentTypes:
          - CFBundleTypeName: TAK Data Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: ["public.zip-archive", "com.pkware.zip-archive"]
            CFBundleTypeIconFiles: []
    entitlements:
      path: Sentinel/Resources/Sentinel.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.artyllm.sentinel
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: SentinelWidget   # bundled at app build time
      - target: SentinelWatch    # watchOS companion app — embedded into the iPhone app

  SentinelWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - SentinelWatch
      - Shared            # shared WatchPayload
    info:
      path: SentinelWatch/Info.plist
      properties:
        CFBundleDisplayName: SENTINEL
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.artyllm.sentinel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.artyllm.sentinel.watchkitapp
        INFOPLIST_FILE: SentinelWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"     # watchOS
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  SentinelWidget:
    type: app-extension
    platform: iOS
    sources:
      - SentinelWidget
      # Share only the wire-shape struct, NOT the controller (the controller depends on iPhone
      # app types like StreamState that aren't in this bundle).
      - path: Shared/SentinelLiveAttributes.swift
    info:
      path: SentinelWidget/Info.plist
      properties:
        CFBundleDisplayName: SENTINEL Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.artyllm.sentinel.widget
        INFOPLIST_FILE: SentinelWidget/Info.plist

  SentinelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SentinelTests]
    dependencies:
      - target: Sentinel
